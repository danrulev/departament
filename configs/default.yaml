app:
  name: "departamentMITM-APP"
  version: "0.1.0"
  env: "development"

auth:
  access_token_ttl: 15m
  refresh_token_ttl: 240h
  jwt_secret: "secret"

photo:
  photo_dir: "./data/photos"
  max_photo_size: 10485760
  max_photos: 10

db:
  local_path: "./data/depatrament_data.db"
  data_dir: "./data"
  export_dir: "./export"

logger:
  level: debug
  development: true
  disable_caller: true
  disable_stacktrace: true
  encoding: json
  output_paths: stderr
  error_output_paths: stderr

server:
  host: localhost
  port: 8080
  max_header_bytes:  1048576
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 120s