<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кафедра — Управление</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>🏛️ Панель кафедры</h1>
            <nav class="tabs">
                <button class="tab active" data-page="equipment">Оборудование</button>
                <button class="tab" data-page="keys">Ключи</button>
                <button class="tab" data-page="users">Пользователи</button>
            </nav>
        </div>
    </header>

    <main class="container">

        <!-- ============ ОБОРУДОВАНИЕ ============ -->
        <section id="page-equipment" class="page active">
            <div class="page-header">
                <h2>Оборудование</h2>
                <div class="actions">
                    <input type="text" id="eq-search" class="input" placeholder="Поиск по названию..." style="width:200px;">
                    <input type="text" id="eq-inventory" class="input" placeholder="Инв. номер..." style="width:150px;">
                    <select id="eq-status-filter" class="input" style="width:150px;">
                        <option value="">Все статусы</option>
                        <option value="available">Доступно</option>
                        <option value="unavailable">Недоступно</option>
                    </select>
                    <button class="btn btn-primary" id="btn-add-eq">+ Добавить</button>
                </div>
            </div>
            <div style="margin-bottom:15px;">
                <button class="btn btn-warning btn-sm" id="btn-expired-verification">⚠️ Просрочена поверка</button>
            </div>
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Инв. номер</th>
                            <th>Локация</th>
                            <th>Ответственный</th>
                            <th>Поверка</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="equipment-table-body">
                        <tr><td colspan="8" class="loading">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="eq-pagination"></div>
        </section>

        <!-- ============ КЛЮЧИ ============ -->
        <section id="page-keys" class="page">
            <div class="page-header">
                <h2>Ключи</h2>
                <div class="actions">
                    <select id="key-status-filter" class="input">
                        <option value="">Все статусы</option>
                        <option value="available">Свободны</option>
                        <option value="issued">Выданы</option>
                        <option value="lost">Утеряны</option>
                    </select>
                    <button class="btn btn-primary" id="btn-add-key">+ Добавить ключ</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Номер</th>
                            <th>Помещение</th>
                            <th>Статус</th>
                            <th>Держатель</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="keys-table-body">
                        <tr><td colspan="6" class="loading">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- ============ ПОЛЬЗОВАТЕЛИ ============ -->
        <section id="page-users" class="page">
            <div class="page-header">
                <h2>Пользователи</h2>
                <div class="actions">
                    <button class="btn btn-primary" id="btn-add-user">+ Добавить пользователя</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ФИО</th>
                            <th>Роль</th>
                            <th>Телефон</th>
                            <th>Email</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr><td colspan="5" class="loading">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Модалка -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Заголовок</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- Тосты -->
    <div class="toast-container" id="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
